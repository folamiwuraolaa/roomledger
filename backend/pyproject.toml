[project]
name = "roommate-ledger-backend"
version = "1.0.0"
requires-python = ">=3.11,<3.13"
dependencies = [
    "Flask>=3.1,<4",
    "Flask-SQLAlchemy>=3.1,<4",
    "Flask-Cors>=6,<7",
    "python-dotenv>=1.1,<2",
    "Werkzeug>=3.1,<4",
    "reportlab>=4.2,<5",
    "gunicorn>=23,<24"
]

[tool.vercel]
entrypoint = "run:app"